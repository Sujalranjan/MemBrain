[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's asyncio layer resumes code inside greenlets; without this, lines after awaits go unmeasured.
concurrency = ["greenlet", "thread"]

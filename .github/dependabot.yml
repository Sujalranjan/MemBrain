version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # requirements.txt holds ranges (e.g. ">=2.3,<3.0"), so new releases inside them are already picked up.
    # Only open a PR when a release falls outside a range; raising minimums can drop Python 3.10 support.
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
